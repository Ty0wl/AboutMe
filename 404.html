<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>404 - Page not found</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="resources/gfx/ui/pageicon_cat.png">
    <style>
        /* ===== 404 PAGE STYLES ===== */
        .error-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            text-align: center;
            background-color: var(--bg-dark);
            color: var(--text);
        }

        .error-code {
            font-family: 'PixelTitle', sans-serif;
            font-size: 72px;
            color: var(--accent);
            text-shadow: 0 0 20px rgba(247, 150, 23, 0.6);
            margin-bottom: 20px;
            line-height: 1;
        }

        .error-title {
            font-family: 'PixelTitle', sans-serif;
            font-size: 24px;
            color: var(--text);
            margin-bottom: 15px;
        }

        .error-text {
            font-family: 'PixelBody', monospace;
            font-size: 14px;
            color: var(--border);
            max-width: 400px;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .error-cat {
            width: 160px;
            height: auto;
            margin: 20px 0 30px;
            image-rendering: pixelated;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .error-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 32px;
            background-color: var(--bg-panel);
            color: var(--text);
            border: 2px solid var(--accent);
            font-family: 'PixelBody', monospace;
            font-size: 16px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .error-btn:hover {
            background-color: var(--accent);
            color: var(--bg-dark);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(247, 150, 23, 0.4);
        }

        .error-hint {
            margin-top: 40px;
            font-family: 'PixelBody', monospace;
            font-size: 12px;
            color: var(--border);
            opacity: 0.7;
        }

        @media (max-width: 768px) {
            .error-code { font-size: 48px; }
            .error-title { font-size: 20px; }
            .error-text { font-size: 13px; }
            .error-cat { width: 130px; }
            .error-btn { padding: 12px 24px; font-size: 14px; }
        }
    </style>
</head>
<body>
    <main class="error-container">
        <div class="error-code">404</div>
        <h1 class="error-title">Oops! The page was not found...</h1>
        <p class="error-text">
            It seems like a trouble... But don't worry, Dice already has gone to find it!
        </p>
        
        <img src="https://raw.githubusercontent.com/Ty0wl/AboutMe/main/resources/gfx/ui/cat_confused.png" 
             alt="Confused Cat" 
             class="error-cat"
             onerror="this.src='https://raw.githubusercontent.com/Ty0wl/AboutMe/main/resources/gfx/ui/cat.png'">
        
        <a href="https://Ty0wl.github.io/AboutMe/index.html" class="error-btn"> <span>Go back home</span> </a>
        
        <p class="error-hint">
            If you sure, that it's a bug, message me!
        </p>
    </main>

    <script>
        const funnyMessages = [
            "Dice dropped this page out of a table...",
            "This page ran away to catch the mouse...",
            "Here's only pixels and sorrow...",
            "404: Content was not found, but Dice is here!",
            "Oops... It seems like the link was broken during it was delivering!"
        ];

        document.addEventListener('DOMContentLoaded', () => {
            const errorText = document.querySelector('.error-text');
            if (errorText) {
                if (Math.random() < 0.3) {
                    errorText.textContent = funnyMessages[Math.floor(Math.random() * funnyMessages.length)];
                }
            }
        });
    </script>
</body>
</html>
